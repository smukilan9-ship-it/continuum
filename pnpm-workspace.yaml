packages:
  - apps/*
  - packages/*

overrides:
  '@hono/node-server': 2.0.10
  fast-uri: 3.1.4
  postcss: ^8.5.10
  sharp: 0.35.0

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@3.0.153'
  - '@ai-sdk/provider-utils@4.0.40'
  - ai@6.0.230
  - '@ai-sdk/openai-compatible@2.0.62'

onlyBuiltDependencies:
  - esbuild
  - sharp
