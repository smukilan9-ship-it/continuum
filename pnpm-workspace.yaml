packages:
  - apps/*
  - packages/*

overrides:
  '@hono/node-server': 2.0.10
  fast-uri: 3.1.4
  postcss: ^8.5.10
  sharp: 0.35.0

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@3.0.153'
  - '@ai-sdk/provider-utils@4.0.40'
  - ai@6.0.230
  - '@ai-sdk/openai-compatible@2.0.62'

onlyBuiltDependencies:
  - esbuild
  - sharp

# Installed on macOS, deployed to linux-x64. Without this, pnpm resolves only
# the host platform's optional dependencies and `sharp` reaches Vercel without
# its libvips binary — which failed at module scope and took `GET /api/sources`
# down with it, so Library reported "We couldn't load your sources".
#
# This lives here and not in package.json: pnpm 11 stopped reading the `pnpm`
# field there, and silently ignored it.
supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - x64
  libc:
    - current
    - glibc
